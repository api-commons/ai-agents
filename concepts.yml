context: ai-agents
name: AI Agents
intro: >-
  The common AI-agent vocabulary -- the agents a platform hosts, the threads of conversation
  with them, the runs that execute them and the tools they can call -- distilled from the APIs
  that already exist. Model inference belongs to the models standard in API Commons.
tags: [AI Agents, Agents, Agentic AI, Agent Platform, Autonomous Agents, Agentic, Conversational AI]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, first_id, last_id]

common_fields:
  id: [uuid, guid, object_id, record_id, agent_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, createdAt]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags, labels]
  status: [state, run_status, agent_status]
  name: [title, display_name, label]
  description: [notes, note, details, summary]

concepts:
  ai_agent:
    path: /ai-agents
    segments: [agents, agent, assistants, assistant, bots, bot, copilots]
    aliases:
      instructions: [system_prompt, prompt, system_message, persona, behavior, role, goal]
      model: [model_id, llm, model_name, llm_model, engine]
      tools: [tool_ids, functions, actions, skills, capabilities, integrations]
      temperature: [model_temperature]
      knowledge_base_ids: [knowledge_bases, knowledge, files, file_ids, data_sources]
  agent_thread:
    requires: [ai_agent]
    path: /agent-threads
    # Singular /chat is a chat-completion call (the models standard's), not a thread.
    segments: [threads, thread, conversations, conversation, chats, sessions@agents|agent|assistants]
    aliases:
      agent_id: [agent, assistant_id, assistant, bot_id]
      messages: [message_count, history, turns]
  agent_run:
    requires: [ai_agent]
    path: /agent-runs
    segments: [runs, run@threads|agents, "executions@agents|agent|tasks|task|workflows", tasks@agents|agent, jobs@agents]
    aliases:
      agent_id: [agent, assistant_id, assistant]
      thread_id: [thread, conversation_id, session_id]
      input: [prompt, query, task, messages, instructions]
      output: [result, response, answer, final_output]
      usage: [tokens, token_usage, cost]
      started_at: [start_time, started]
      completed_at: [finished_at, ended_at, end_time]
  agent_tool:
    requires: [ai_agent]
    path: /agent-tools
    segments: [tools, tool, functions@agents|assistants|tools, actions@agents|agent, skills@agents|agent, integrations@agents]
    aliases:
      parameters: [input_schema, schema, json_schema, arguments, inputs]
      type: [tool_type, kind]

duplicates:
  duvo-ai: [duvoai]
  parallel-ai: [parallel, parallel-web-systems]
  sail: [sail-research]
  eventwren: [hagglebee, yarnhen, yawplet]
  rime-ai: [ottic]

findings:
  - "An agent agrees on its name, id and created_at -- and not on what makes it an agent: its
    instructions sit at 29%, and the model and the tools it may call are each carried by a
    minority under different names. 156 platforms expose an agent; they describe its brain
    156 ways."
  - "A tool agrees on name, description and a parameters schema -- the function-calling shape the
    model providers defined, which agent platforms adopted wholesale."
  - "A run agrees on status, id and created_at; a thread only on id and created_at."
decisions:
  - "Agents are `/ai-agents`, threads `/agent-threads`, runs `/agent-runs` and tools
    `/agent-tools`: help desk owns agents, messaging owns conversations, and CI/CD and workflow
    automation own runs."
  - "Assistants, bots and copilots are agents."
  - "Singular `/chat` is a chat-completion call and belongs to the models standard, not here."
  - "Executions count as runs only beneath an agent, task or workflow path."
  - "Duplicates merged: Duvo, Parallel, Sail, Ottic into Rime, and the eventwren family."

workflows:
  - id: run-an-agent
    summary: Create an agent with a tool, open a thread and run the agent on it
    steps:
      - {op: createAgentTool, id: tool}
      - {op: createAiAgent, id: agent}
      - {op: createAgentThread, id: thread, link: {agent_id: "$steps.agent.outputs.id"}}
      - {op: createAgentRun, id: run, link: {agent_id: "$steps.agent.outputs.id", thread_id: "$steps.thread.outputs.id"}}
